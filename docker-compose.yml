services:
  postgres:
    image: postgres:16-alpine
    container_name: gdtrainer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdtrainer
      POSTGRES_PASSWORD: gdtrainer
      POSTGRES_DB: gdtrainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdtrainer -d gdtrainer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gdtrainer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
